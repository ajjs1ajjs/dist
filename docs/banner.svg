<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IT-Enterprise Distribution">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/>
      <stop offset="0.55" stop-color="#0d1226"/>
      <stop offset="1" stop-color="#150b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7b2fff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7b2fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="132" fill="#ffffff" font-size="56" font-weight="700" letter-spacing="-1">IT-Enterprise · Distribution</text>
    <text x="80" y="182" fill="#a9bdd4" font-size="25">Публічні інсталятори та готові збірки</text>
    <text x="80" y="220" fill="#6b7c93" font-size="19">Вихідний код — у приватних репозиторіях; тут лише те, що завантажують користувачі</text>
  </g>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="80" y="250" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.09"/>
    <text x="132" y="276" text-anchor="middle" fill="#7fdfff">BCK</text>

    <rect x="200" y="250" width="232" height="40" rx="20" fill="#ffffff" fill-opacity="0.09"/>
    <text x="316" y="276" text-anchor="middle" fill="#c3b1ff">Resource Calculator</text>
  </g>
</svg>
