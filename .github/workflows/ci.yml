name: Distribution contract checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax and catalog
        run: |
          node --check app.js
          node --check translations.js
          node scripts/validate-dialog-accessibility.mjs
          node --check scripts/sync-hub.mjs
          node scripts/sync-hub.mjs --check-catalog
          node scripts/validate-sales-worker.mjs
        env:
          SITE_DIR: /tmp/no-site-here
      - name: Check installer shell syntax
        run: |
          for file in apps/bck/install.sh apps/mygit/install.sh apps/monitoring/install.sh apps/uptime-monitor/install.sh apps/uptime-monitor/subnet-seed.sh; do
            bash -n "$file"
          done
      - name: Test Sales fetcher
        working-directory: apps/sales/fetch
        run: |
          npm ci
          npm run check
          npm test
          npm audit --audit-level=high
