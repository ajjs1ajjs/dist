# Dependabot auto-merge: minor/patch updates merge themselves once CI is green.
# Major bumps are left for human review. No monitoring needed.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Wait for all CI checks (fail fast on red), then squash-merge.
      # Direct merge AFTER green CI: no race with still-running jobs,
      # no repo-settings changes needed.
      - name: Wait for CI and merge minor/patch
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --squash --delete-branch
