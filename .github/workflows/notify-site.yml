# Після публікації будь-якого релізу в dist миттєво шле подію
# dist-release в ajjs1ajjs/SITE — SITE сам переписує версії +
# свіжі лінки в public/index.html і деплоїться.
# Секрет: SITE_DISPATCH_TOKEN (токен з доступом до SITE).
# Ручний тест: Actions -> Notify SITE -> Run workflow.

name: Notify SITE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для тесту (напр. rdm-v2.1.16)'
        required: false
        default: 'manual-test'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dist-release to SITE
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.tag }}"; fi
          URL="${{ github.event.release.html_url }}"
          echo "Сповіщаю SITE про $TAG ($URL)"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/ajjs1ajjs/SITE/dispatches \
            -d "{\"event_type\":\"dist-release\",\"client_payload\":{\"tag\":\"$TAG\",\"html_url\":\"$URL\"}}"
          echo "OK: подію dist-release надіслано."
