name: Release retention (keep last 3)

# Shared hub: every product version duplicates full binaries, so keep only
# the 3 newest `prefix-vX.Y.Z` releases per product. Older ones go away
# together with their tags (`--cleanup-tag`).
#
# Manually triggered only; no scheduled deletions.
# NOTE: GitHub Releases on public repos are free/unlimited — this is hygiene,
# not quota. Rollback is always possible to 2 previous versions, plus any
# version can be rebuilt from source (`Release-Local.ps1 -Version X.Y.Z`).

on:
  workflow_dispatch:
    inputs:
      confirm_prune:
        description: 'Delete releases older than the newest three for each product'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete releases older than newest 3 per prefix
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_prune == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: '3'
          PREFIXES: 'sales gym bck kubelens rdm diskcleaner monitoring mygit uptime game netscope vilno slovakia'
        run: |
          set -euo pipefail
          # Fetch all pages once; an API failure must stop before any deletion.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          for prefix in $PREFIXES; do
            old=$(printf '%s\n' "$tags" | { grep -E "^${prefix}-v[0-9]+\.[0-9]+\.[0-9]+$" || true; } \
              | sed "s/^${prefix}-v//" | sort -V -r | tail -n +$((KEEP+1)))
            if [ -z "$old" ]; then
              echo "$prefix: nothing to prune"
              continue
            fi
            echo "$old" | while read -r ver; do
              [ -n "$ver" ] || continue
              tag="${prefix}-v${ver}"
              echo "deleting $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done
          done
