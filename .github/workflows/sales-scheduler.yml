name: Sales — update deals & deploy

# Runs in this public dist repo (Actions minutes are free for public repos).
# Fetches the latest deals, writes them into the hosted site's data files and
# pushes — GitHub Pages (from main) redeploys automatically.
#
# Triggers: зовнішній cron (Cloudflare Worker apps/sales/cron) викликає
# workflow_dispatch рівно о 07:00 UTC — GitHub schedule затримується на
# години. Розклад нижче лишається страховкою; руками — Actions → Run workflow.
#
# Secrets required in this repo:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (for the Telegram channel posts)

on:
  schedule:
    # Раз на день: 07:00 UTC = 09:00 Київ (зима), 10:00 (літо).
    # GitHub cron тільки UTC, одного виразу на весь рік для 09:00 нема.
    # Публічне репо: хвилини Actions безкоштовні.
    # Steam API без ключа: ~4 запити на ран — далеко від лімітів.
    # NB: фактично GitHub затримує цей розклад на 5–8 год — точний час
    # дає зовнішній тригер (apps/sales/cron → workflow_dispatch).
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sales-fetch
  cancel-in-progress: true

jobs:
  fetch:
    # Secrets are used ONLY for trusted events. This repo has no push/PR
    # triggers, and workflow_dispatch requires write access — so untrusted
    # (fork) PRs can never reach the Telegram token. The guard is defensive:
    # it keeps that property even if a trigger is added later.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/sales/fetch/package-lock.json

      - name: Install fetcher dependencies
        working-directory: apps/sales/fetch
        run: npm ci

      - name: Fetch latest deals
        working-directory: apps/sales/fetch
        env:
          DEALS_DIR: ${{ github.workspace }}/sales/data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run fetch

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales/data/deals.json sales/data/notified-history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(sales): update deals data"
          # Another run may have pushed while we were fetching — rebase first.
          git pull --rebase --autostash origin main || {
            git checkout --theirs -- sales/data/deals.json sales/data/notified-history.json
            git add sales/data/deals.json sales/data/notified-history.json
            GIT_EDITOR=true git rebase --continue
          }
          git push origin HEAD:main
