name: Sales — update deals & deploy

# Runs in this public dist repo (Actions minutes are free for public repos).
# Fetches the latest deals, writes them into the hosted site's data files and
# pushes — GitHub Pages (from main) redeploys automatically.
#
# Triggers: зовнішній cron (Cloudflare Worker apps/sales/cron) викликає
# workflow_dispatch ЩОГОДИНИ — GitHub schedule затримується на години.
# Розклад нижче лишається страховкою; руками — Actions → Run workflow.
#
# Secrets required in this repo:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  (for the Telegram channel posts)

on:
  schedule:
    # Раз на день: 07:00 UTC = 09:00 Київ (зима), 10:00 (літо).
    # GitHub cron тільки UTC, одного виразу на весь рік для 09:00 нема.
    # Публічне репо: хвилини Actions безкоштовні.
    # Steam API без ключа: ~4 запити на ран — далеко від лімітів.
    # NB: фактично GitHub затримує цей розклад на 5–8 год — точний час
    # дає зовнішній тригер (apps/sales/cron → workflow_dispatch).
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sales-fetch
  # Delivery has external side effects. Queue the next run instead of killing
  # a worker after Telegram accepted a batch but before its history is pushed.
  cancel-in-progress: false

jobs:
  fetch:
    # Secrets are used ONLY for trusted events. This repo has no push/PR
    # triggers, and workflow_dispatch requires write access — so untrusted
    # (fork) PRs can never reach the Telegram token. The guard is defensive:
    # it keeps that property even if a trigger is added later.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/sales/fetch/package-lock.json

      - name: Install fetcher dependencies
        working-directory: apps/sales/fetch
        run: npm ci

      - name: Check fetcher types
        working-directory: apps/sales/fetch
        run: npm run check

      - name: Test fetcher safety cases
        working-directory: apps/sales/fetch
        run: npm test

      - name: Fetch latest deals
        working-directory: apps/sales/fetch
        env:
          DEALS_DIR: ${{ github.workspace }}/sales/data
        run: npm run fetch -- --prepare

      - name: Checkpoint prepared notifications and deliver one at a time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          checkpoint() {
            git add sales/data/deals.json sales/data/notified-history.json sales/data/notification-outbox.json
            if git diff --cached --quiet; then return 0; fi
            git commit -m "chore(sales): checkpoint notification state"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                git fetch origin main
                return 0
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase conflict; durable Sales checkpoints were preserved on origin."
                return 1
              fi
            done
            echo "Could not push Sales checkpoint after three attempts."
            return 1
          }

          checkpoint

          while true; do
            claim_output="$(npm --prefix apps/sales/fetch run fetch -- --claim-next)"
            echo "$claim_output"
            if [[ "$claim_output" == *NO_PENDING* ]]; then
              # claim-next may have changed an interrupted `sending` entry to
              # `uncertain`; persist that recovery transition before exit.
              checkpoint
              break
            fi
            if [[ "$claim_output" != *CLAIMED\ * ]]; then
              echo "Fetcher did not return a durable claim; stopping."
              exit 1
            fi

            # Persist the sending claim before making the external request.
            checkpoint
            npm --prefix apps/sales/fetch run fetch -- --send-claimed
            # Persist delivered/blocked/uncertain state before the next message.
            checkpoint
          done
        env:
          DEALS_DIR: ${{ github.workspace }}/sales/data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Report uncertain or blocked outbox items
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('node:fs');
          const outboxPath = 'sales/data/notification-outbox.json';
          if (!fs.existsSync(outboxPath)) process.exit(0);
          const outbox = JSON.parse(fs.readFileSync(outboxPath, 'utf8'));
          const stuck = (outbox.messages || []).filter((m) => m.status === 'uncertain' || m.status === 'blocked');
          if (stuck.length === 0) process.exit(0);
          console.log(`::warning::${stuck.length} notification outbox message(s) in uncertain/blocked state require operator review.`);
          const lines = [
            '### Notification outbox entries awaiting resolution',
            '',
            '| ID | Status | Last error | Receipts |',
            '| --- | --- | --- | --- |',
            ...stuck.map((m) => `| \`${m.id}\` | \`${m.status}\` | ${String(m.lastError || '—').replace(/\|/g, '\\|')} | ${(m.receipts || []).length} |`),
            '',
            'Recovery commands (with `DEALS_DIR=sales/data`):',
            '- Inspect queue: `npm --prefix apps/sales/fetch run fetch -- --list-outbox`',
            '- Confirm sent to Telegram: `npm --prefix apps/sales/fetch run fetch -- --resolve <id> delivered`',
            '- Retry delivery: `npm --prefix apps/sales/fetch run fetch -- --resolve <id> pending`',
          ];
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          }
          EOF
