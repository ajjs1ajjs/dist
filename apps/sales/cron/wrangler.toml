# Cloudflare Worker: dispatch sales-шедулера в цьому ж репо (публічний dist).
# Навіщо: GitHub schedule-тригери стабільно затримуються на 5–8 годин — цей
# воркер викликає workflow_dispatch ЩОГОДИНИ. Пости в Telegram виходять лише
# за НОВИМИ знижками (≥50%, до 10 за ран), тож частота постів = частота хвиль
# нових знижок, а не 24/добу. Розклад у самому воркфлоу — страховка.
#
# Секрет: GITHUB_TOKEN — PAT з правом тригерити Actions у dist (Actions: write).
# Задати: gh auth token | npx wrangler secret put GITHUB_TOKEN  (або дашборд CF)
#
# Деплой з цієї теки: npx wrangler deploy   Логи: npx wrangler tail
name = "sales-cron"
main = "src/index.js"
compatibility_date = "2026-10-10"

[triggers]
crons = ["0 * * * *"]
