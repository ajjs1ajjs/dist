# Cloudflare Worker: щоденний dispatch sales-шедулера в цьому ж репо (публічний dist).
# Навіщо: GitHub schedule-тригери стабільно затримуються на 5–8 годин — цей
# воркер викликає workflow_dispatch рівно о 07:00 UTC (09:00 Київ взимку,
# 10:00 влітку). Розклад у самому воркфлоу лишається як страховка.
#
# Секрет: GITHUB_TOKEN — fine-grained PAT (тільки repo ajjs1ajjs/dist,
# право Actions: Read and write). Задати: npx wrangler secret put GITHUB_TOKEN
#
# Деплой з цієї теки: npx wrangler deploy   Логи: npx wrangler tail
name = "sales-cron"
main = "src/index.js"
compatibility_date = "2026-10-10"

[triggers]
crons = ["0 7 * * *"]
